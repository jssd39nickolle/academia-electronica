<!DOCTYPE html>

<title>Multímetro Digital V3.3 · Academia de Electrónica</title>
<style>html,body{margin:0;width:100%;height:100%;background:#05060a;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="curso" src="multimetro.html" title="Curso Multímetro Digital"></iframe>
<script>
const frame=document.getElementById('curso');
frame.addEventListener('load',()=>{
 const d=frame.contentDocument;
 const style=d.createElement('style');
 style.textContent=`
 .engineering-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.eng-card{border:1px solid rgba(0,229,255,.17);border-radius:16px;padding:17px;background:linear-gradient(180deg,rgba(10,17,27,.96),rgba(5,9,15,.96))}.eng-card h3{color:#00e5ff;margin:.2rem 0 .55rem}.eng-card b{color:#fff}.app-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.app-card{border:1px solid rgba(57,255,20,.16);border-radius:14px;padding:15px;background:#080d14}.app-card h4{color:#39ff14;margin:.15rem 0 .45rem}.diode-lab{border:1px solid rgba(0,229,255,.2);border-radius:20px;padding:20px;background:radial-gradient(circle at 50% 10%,rgba(0,229,255,.08),transparent 35%),#060a10}.diode-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.diode-visual{border:1px solid #243649;border-radius:16px;background:#030609;padding:15px}.diode-meter{background:linear-gradient(145deg,#f5d824,#f4ad00);border-radius:18px;padding:14px;max-width:260px;margin:0 auto 18px;box-shadow:0 0 28px rgba(255,220,0,.13)}.diode-screen{background:#cce3c8;border:6px solid #17201b;border-radius:8px;padding:12px;text-align:right;font:700 2rem 'Courier New',monospace;color:#0b2511}.probe-row{display:flex;justify-content:space-between;gap:10px;margin:14px 0;font-weight:900}.probe-red{color:#ff4969}.probe-black{color:#dce6ef}.diode-body{position:relative;margin:42px auto 22px;width:min(430px,90%);height:58px;background:linear-gradient(90deg,#d9d9c8,#efefdf 70%,#c8c8b8);border-radius:10px;box-shadow:0 0 18px rgba(255,255,255,.08)}.diode-body:before,.diode-body:after{content:'';position:absolute;top:26px;width:100px;height:5px;background:#b8bec6}.diode-body:before{right:100%}.diode-body:after{left:100%}.cathode-band{position:absolute;right:36px;top:0;width:18px;height:100%;background:#31343a}.terminal-labels{display:flex;justify-content:space-between;margin:0 auto;max-width:610px;color:#aebdca;font-weight:800}.diode-symbol{font:900 2.2rem monospace;text-align:center;color:#00e5ff;text-shadow:0 0 14px rgba(0,229,255,.35)}.diode-btn{display:block;margin:16px auto 0;border:0;border-radius:10px;padding:11px 16px;font-weight:900;cursor:pointer;background:linear-gradient(90deg,#39ff14,#00e5ff,#ff2bd6);color:#03100c}.diag-table td:first-child{font-weight:900;color:#fff}.pn-box{border-left:4px solid #ff2bd6;background:rgba(255,43,214,.06);padding:14px;border-radius:10px}.mini-formula{font-family:monospace;background:#020406;border:1px solid #233346;border-radius:10px;padding:12px;color:#b8ffc8}.diode-state{font-weight:900;text-align:center;color:#39ff14;margin-top:10px}@media(max-width:900px){.engineering-grid,.app-grid,.diode-layout{grid-template-columns:1fr}}
 `;
 d.head.appendChild(style);
 const main=d.querySelector('main');
 const first=d.getElementById('modelos');
 const fundamentals=d.createElement('section');
 fundamentals.className='lesson'; fundamentals.id='fundamentos';
 fundamentals.innerHTML=`<span class="lesson-number">00 · FUNDAMENTOS</span><h2>¿Qué es un multímetro digital?</h2><p class="lead">Un <b>multímetro digital (DMM)</b> es un instrumento electrónico de medición que integra, como mínimo, las funciones de <b>voltímetro, amperímetro y óhmetro</b>. Convierte una magnitud eléctrica aplicada a sus bornes en una señal acondicionada que un convertidor analógico-digital procesa y presenta numéricamente.</p><div class="engineering-grid"><div class="eng-card"><h3>Principio de medición</h3><p>En tensión, el instrumento toma una muestra mediante una red de entrada de alta impedancia. En corriente, obliga a la corriente medida a atravesar un <b>shunt</b> interno y determina la caída de tensión en él. En resistencia, utiliza su batería interna para aplicar una señal de prueba conocida y calcula el valor a partir de la respuesta del componente.</p></div><div class="eng-card"><h3>Impedancia de entrada</h3><p>En muchos DMM modernos la entrada de voltaje es del orden de <b>10 MΩ</b>, aunque depende del modelo y función. Una impedancia alta reduce el efecto de carga sobre el circuito. Siempre debe verificarse la especificación del fabricante.</p></div><div class="eng-card"><h3>Resolución</h3><p>Es la mínima variación que puede representar el instrumento en un rango determinado. Está relacionada con los <b>counts</b> o dígitos de pantalla. Más resolución permite observar cambios más pequeños, pero <b>no implica automáticamente mayor exactitud</b>.</p></div><div class="eng-card"><h3>Exactitud</h3><p>Expresa qué tan próxima puede estar la indicación al valor real dentro de condiciones especificadas. Normalmente el fabricante la declara como <b>±(% de la lectura + dígitos/counts)</b>. Por eso una lectura con muchas cifras no necesariamente es una lectura más exacta.</p></div></div><div class="callout info"><strong>Concepto ingenieril:</strong> el multímetro no “ve” directamente voltios, amperios u ohmios. Su electrónica de entrada acondiciona la variable, la convierte a una magnitud procesable y el sistema digital calcula y presenta el resultado.</div>`;
 main.insertBefore(fundamentals,first);
 const apps=d.createElement('section'); apps.className='lesson'; apps.id='aplicaciones';
 apps.innerHTML=`<span class="lesson-number">00B · APLICACIONES</span><h2>¿Para qué se utiliza un multímetro?</h2><p class="lead">Es uno de los instrumentos fundamentales de mantenimiento porque permite convertir una sospecha de falla en <b>evidencia eléctrica medible</b>.</p><div class="app-grid"><div class="app-card"><h4>⚡ Alimentación</h4><p>Verificar baterías, fuentes DC/AC, reguladores y caídas de tensión entre etapas.</p></div><div class="app-card"><h4>🔎 Diagnóstico PCB</h4><p>Seguir líneas de alimentación, comprobar puntos de prueba y localizar interrupciones o cortocircuitos.</p></div><div class="app-card"><h4>Ω Componentes</h4><p>Comprobar resistencias, potenciómetros y valores fuera de tolerancia con el circuito desenergizado.</p></div><div class="app-card"><h4>→| Semiconductores</h4><p>Evaluar diodos y LED mediante su caída directa y comportamiento en polarización inversa.</p></div><div class="app-card"><h4>🔊 Conductores</h4><p>Revisar cables, fusibles, interruptores, conectores, pistas y contactos mediante continuidad.</p></div><div class="app-card"><h4>A Consumo</h4><p>Medir corriente de una carga insertando correctamente el instrumento en serie y respetando bornes y fusibles.</p></div><div class="app-card"><h4>▯ Capacitores</h4><p>Medir capacitancia cuando el modelo dispone de la función, después de descargar el componente.</p></div><div class="app-card"><h4>Hz Señales</h4><p>Comprobar frecuencia y ciclo de trabajo en equipos que incorporan estas funciones.</p></div><div class="app-card"><h4>🛠 Mantenimiento</h4><p>Comparar valores nominales, puntos buenos/con falla y documentar resultados antes y después de una intervención.</p></div></div>`;
 main.insertBefore(apps,first);
 const nav=d.querySelector('.side-nav');
 if(nav){const strong=nav.querySelector('strong'); strong.insertAdjacentHTML('afterend','<a href="#fundamentos">00 · ¿Qué es un multímetro?</a><a href="#aplicaciones">00B · Aplicaciones</a>');}
 const dio=d.getElementById('diodos');
 if(dio) dio.innerHTML=`<span class="lesson-number">07 · DIODOS</span><h2>Diodo semiconductor: estructura, polarización y diagnóstico</h2><p class="lead">Un <b>diodo</b> es un dispositivo semiconductor de dos terminales basado, en su forma elemental, en una <b>unión PN</b>. Su característica principal es permitir una conducción significativa en polarización directa y restringir la corriente en polarización inversa dentro de sus límites de diseño.</p><div class="engineering-grid"><div class="eng-card"><h3>Ánodo (A)</h3><p>Terminal asociado al lado P. Para una prueba directa convencional se conecta la <b>punta roja</b> del multímetro al ánodo.</p></div><div class="eng-card"><h3>Cátodo (K)</h3><p>Terminal asociado al lado N. En muchos diodos axiales se identifica físicamente mediante una <b>banda</b>. En prueba directa recibe la <b>punta negra</b>.</p></div></div><div class="pn-box"><b>Unión PN:</b> al polarizar directamente el dispositivo se reduce la barrera de potencial y aumenta la conducción. Al polarizarlo inversamente, la región de agotamiento aumenta y la corriente queda limitada principalmente a corrientes de fuga, hasta alcanzar —si se excede— la región de ruptura.</div><h3>Prueba interactiva con multímetro</h3><div class="diode-lab"><div class="diode-layout"><div class="diode-visual"><div class="diode-meter"><div class="diode-screen" id="diodeReading">0.642 V</div></div><div class="probe-row"><span id="leftProbe" class="probe-red">● ROJA (+)</span><span id="rightProbe" class="probe-black">● NEGRA (COM)</span></div><div class="diode-body"><span class="cathode-band"></span></div><div class="terminal-labels"><span>ÁNODO (A)</span><span>CÁTODO (K) · BANDA</span></div><div class="diode-symbol">A ──|&gt;|── K</div><div class="diode-state" id="diodeState">POLARIZACIÓN DIRECTA · CONDUCCIÓN</div><button class="diode-btn" id="invertDiode">↔ INVERTIR PUNTAS</button></div><div><h3>¿Qué hace la función Diodo?</h3><p>El DMM utiliza su batería interna para establecer una corriente de prueba controlada a través del semiconductor y muestra aproximadamente la <b>tensión directa V<sub>F</sub></b>. No está midiendo simplemente resistencia.</p><div class="mini-formula">ROJA → ÁNODO<br>NEGRA → CÁTODO<br>Si sano ≈ 0.55–0.75 V<br><br>INVERTIR PUNTAS → OL</div><p><b>Importante:</b> la corriente y tensión de prueba dependen del modelo. Algunos multímetros no disponen de suficiente tensión de prueba para encender o evaluar correctamente ciertos LED.</p></div></div></div><h3>Valores orientativos</h3><div class="table-wrap"><table class="diag-table"><tr><th>Dispositivo</th><th>Directa típica</th><th>Inversa</th><th>Interpretación</th></tr><tr><td>Silicio</td><td>≈ 0.55–0.75 V</td><td>OL</td><td>Comportamiento típico sano</td></tr><tr><td>Schottky</td><td>≈ 0.15–0.45 V</td><td>OL</td><td>Menor caída directa</td></tr><tr><td>LED</td><td>≈ 1.6–3.4 V, según tecnología/color</td><td>OL</td><td>Puede requerir mayor tensión de prueba</td></tr><tr><td>Diodo abierto</td><td>OL</td><td>OL</td><td>No conduce en ninguno de los sentidos</td></tr><tr><td>Diodo en corto</td><td>≈ 0 V</td><td>≈ 0 V</td><td>Conduce anormalmente en ambos sentidos</td></tr></table></div><div class="callout warning"><strong>Medición en circuito:</strong> resistencias, semiconductores y otras rutas en paralelo pueden alterar la lectura. Cuando el resultado sea ambiguo, desenergice, descargue capacitores y aísle al menos una terminal del diodo para una comprobación concluyente.</div><div class="callout info"><strong>Diodo ≠ continuidad:</strong> continuidad determina si existe una trayectoria suficientemente baja en resistencia según el umbral del instrumento; la función diodo aplica condiciones específicas de prueba y presenta la caída de tensión directa.</div>`;
 const btn=d.getElementById('invertDiode'); let direct=true;
 if(btn) btn.onclick=()=>{direct=!direct; d.getElementById('diodeReading').textContent=direct?'0.642 V':'OL'; const lp=d.getElementById('leftProbe'),rp=d.getElementById('rightProbe'); lp.textContent=direct?'● ROJA (+)':'● NEGRA (COM)'; rp.textContent=direct?'● NEGRA (COM)':'● ROJA (+)'; lp.className=direct?'probe-red':'probe-black'; rp.className=direct?'probe-black':'probe-red'; const st=d.getElementById('diodeState'); st.textContent=direct?'POLARIZACIÓN DIRECTA · CONDUCCIÓN':'POLARIZACIÓN INVERSA · BLOQUEO'; st.style.color=direct?'#39ff14':'#ff2bd6';};
});
</script>
</body>
</html>
